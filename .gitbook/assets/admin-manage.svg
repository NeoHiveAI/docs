<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .al { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C084FC"/></marker>
    <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1A2E"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Archive, restore, delete</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">ARCHIVE CAN BE UNDONE FOR 30 DAYS. DELETE CANNOT.</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="170" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#99E6DC" stroke-width="1"/>
  <text x="56" y="192" class="lbl" fill="#0D9488">ACTIVE</text>
  <text x="56" y="214" class="title">Hive in use</text>
  <text x="56" y="233" class="body">In the sidebar and card grid.</text>
  <text x="56" y="249" class="body">Agents can connect.</text>
  <rect x="380" y="170" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#F3D19C" stroke-width="1"/>
  <text x="396" y="192" class="lbl" fill="#B45309">ARCHIVED</text>
  <text x="396" y="214" class="title">In the Archived section</text>
  <text x="396" y="233" class="body">Hidden from the sidebar.</text>
  <text x="396" y="249" class="body">Shows days left.</text>
  <rect x="720" y="170" width="240" height="110" rx="10" fill="#FFFFFF" stroke="#1A1A2E" stroke-width="1"/>
  <text x="736" y="192" class="lbl" fill="#1A1A2E">DELETED</text>
  <text x="736" y="214" class="title">Gone for good</text>
  <text x="736" y="233" class="body">Memories, indexes, sync</text>
  <text x="736" y="249" class="body">history and settings removed.</text>
  <path d="M280 200 L376 200" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#ara)"/>
  <text x="328" y="191" class="al" text-anchor="middle" style="fill:#B45309">Archive</text>
  <path d="M380 250 L284 250" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#art)"/>
  <text x="332" y="270" class="al" text-anchor="middle" style="fill:#0D9488">Restore</text>
  <path d="M620 225 L716 225" fill="none" stroke="#1A1A2E" stroke-width="2" marker-end="url(#ari)"/>
  <text x="668" y="206" class="al" text-anchor="middle" style="fill:#1A1A2E">after 30 days</text>
  <text x="668" y="246" class="al" text-anchor="middle" style="fill:#1A1A2E">or Delete</text>
  <text x="668" y="260" class="al" text-anchor="middle" style="fill:#1A1A2E">Permanently</text>
  <path d="M160 170 C160 118, 840 118, 840 166" fill="none" stroke="#1A1A2E" stroke-width="2" marker-end="url(#ari)"/>
  <text x="500" y="124" class="al" text-anchor="middle" style="fill:#1A1A2E">Delete, then type the hive name</text>
  <rect x="40" y="312" width="920" height="52" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="58" y="343" class="body" font-size="12.5">Indexes have no archive. Move Index… and Share Index… keep the data; Delete Index removes it at once.</text>
</svg>
