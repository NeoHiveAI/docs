<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="350" viewBox="0 0 1000 350" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .al { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C084FC"/></marker>
    <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1A2E"/></marker>
  </defs>
  <rect width="1000" height="350" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">What uninstall removes</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">YOUR DATA STAYS UNLESS YOU ASK FOR IT TO GO</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="120" width="296" height="200" rx="10" fill="#FFFFFF" stroke="#F3D19C" stroke-width="1.5"/>
  <text x="56" y="142" class="lbl" fill="#B45309">REMOVED</text>
  <text x="56" y="164" class="body" style="fill:#737373" font-size="11.5">by uninstall.sh</text>
  <circle cx="60" cy="194" r="3" fill="#B45309"/>
  <text x="72" y="198" class="body" style="fill:#1A1A2E" font-size="12.5">The neohive container,</text>
  <text x="72" y="215" class="body" font-size="12">stopped cleanly to free the seat</text>
  <circle cx="60" cy="239" r="3" fill="#B45309"/>
  <text x="72" y="243" class="body mono" style="fill:#1A1A2E" font-size="11.5">~/.cache/neohive/license-key</text>
  <circle cx="60" cy="267" r="3" fill="#B45309"/>
  <text x="72" y="271" class="body" style="fill:#1A1A2E" font-size="12.5">The Metal worker</text>
  <text x="72" y="288" class="body" font-size="12">on Apple Silicon</text>
  <rect x="352" y="120" width="296" height="200" rx="10" fill="#FFFFFF" stroke="#99E6DC" stroke-width="1.5"/>
  <text x="368" y="142" class="lbl" fill="#0D9488">KEPT</text>
  <text x="368" y="164" class="body" style="fill:#737373" font-size="11.5">removed only with --purge-data</text>
  <circle cx="372" cy="194" r="3" fill="#0D9488"/>
  <text x="384" y="198" class="body" style="fill:#1A1A2E" font-size="12.5">The neohive-data volume:</text>
  <text x="384" y="215" class="body" font-size="12">every hive, index and memory</text>
  <circle cx="372" cy="239" r="3" fill="#0D9488"/>
  <text x="384" y="243" class="body mono" style="fill:#1A1A2E" font-size="11.5">~/.cache/neohive/machine-id</text>
  <circle cx="372" cy="267" r="3" fill="#0D9488"/>
  <text x="384" y="271" class="body mono" style="fill:#1A1A2E" font-size="11.5">~/.neohive models and logs</text>
  <rect x="664" y="120" width="296" height="200" rx="10" fill="#FFFFFF" stroke="#E4DFF1" stroke-width="1.5"/>
  <text x="680" y="142" class="lbl" fill="#7C3AED">BY HAND</text>
  <text x="680" y="164" class="body" style="fill:#737373" font-size="11.5">the script prints these steps</text>
  <circle cx="684" cy="194" r="3" fill="#7C3AED"/>
  <text x="696" y="198" class="body" style="fill:#1A1A2E" font-size="12.5">The agent plugin</text>
  <circle cx="684" cy="222" r="3" fill="#7C3AED"/>
  <text x="696" y="226" class="body" style="fill:#1A1A2E" font-size="12.5">Each NeoHive MCP entry,</text>
  <text x="696" y="243" class="body" font-size="12">one per hive</text>
</svg>
