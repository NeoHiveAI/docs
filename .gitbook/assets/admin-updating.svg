<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="420" viewBox="0 0 1000 420" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .al { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C084FC"/></marker>
    <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1A2E"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">What re-running the installer does</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">YOUR DATA STAYS IN THE neohive-data VOLUME THE WHOLE TIME</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="124" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="68" cy="152" r="11" fill="#7C3AED"/>
  <text x="68" y="156.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="88" y="157" class="title">Read the license</text>
  <text x="58" y="186" class="body">Reuses the cached key</text>
  <path d="M320 172 L356 172" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arv)"/>
  <rect x="360" y="124" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="388" cy="152" r="11" fill="#7C3AED"/>
  <text x="388" y="156.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="408" y="157" class="title">Check the license</text>
  <text x="378" y="186" class="body">With the licensing service</text>
  <path d="M640 172 L676 172" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arv)"/>
  <rect x="680" y="124" width="280" height="96" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="708" cy="152" r="11" fill="#7C3AED"/>
  <text x="708" y="156.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="728" y="157" class="title">Detect hardware</text>
  <text x="698" y="186" class="body">Picks GPU or CPU again</text>
  <rect x="40" y="270" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="68" cy="298" r="11" fill="#7C3AED"/>
  <text x="68" y="302.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="88" y="303" class="title">Pull the image</text>
  <text x="58" y="332" class="body">Latest release for</text>
  <text x="58" y="348" class="body">your hardware</text>
  <path d="M320 318 L356 318" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arv)"/>
  <rect x="360" y="270" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="388" cy="298" r="11" fill="#7C3AED"/>
  <text x="388" y="302.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="408" y="303" class="title">Stop the old one</text>
  <text x="378" y="332" class="body">Frees its license seat.</text>
  <text x="378" y="348" class="body">Waits up to 30 seconds.</text>
  <path d="M640 318 L676 318" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arv)"/>
  <rect x="680" y="270" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#99E6DC" stroke-width="1"/>
  <circle cx="708" cy="298" r="11" fill="#0D9488"/>
  <text x="708" y="302.5" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">6</text>
  <text x="728" y="303" class="title">Start the new one</text>
  <text x="698" y="332" class="body">Same volume, then prints</text>
  <text x="698" y="348" class="body">what is new</text>
  <path d="M820 220 L820 238 L180 238 L180 266" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arv)"/>
</svg>
