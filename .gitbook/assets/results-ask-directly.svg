<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="340" viewBox="0 0 1000 340" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
  </defs>
  <rect width="1000" height="340" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Ask for context directly</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">EACH DETAIL YOU ADD NARROWS WHERE YOUR AGENT LOOKS</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="118" width="920" height="58" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="40" y="118" width="3.5" height="58" rx="1.75" fill="#7C3AED"/>
  <text x="60" y="141" class="lbl" fill="#7C3AED">EVERY INDEX IN THE HIVE</text>
  <text x="60" y="162" font-size="12.5" fill="#1A1A2E">“How does the retry logic in the billing webhook work?”</text>
  <text x="942" y="141" font-size="12" font-weight="700" text-anchor="end" fill="#1A1A2E">Ask a plain question</text>
  <text x="942" y="162" font-size="11" class="mono" text-anchor="end" fill="#6D28D9">memory_recall · no filter</text>
  <rect x="130" y="188" width="740" height="58" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="130" y="188" width="3.5" height="58" rx="1.75" fill="#7C3AED"/>
  <text x="150" y="211" class="lbl" fill="#7C3AED">ONE KIND OF MEMORY</text>
  <text x="150" y="232" font-size="12.5" fill="#1A1A2E">“What conventions do we follow for error handling?”</text>
  <text x="852" y="211" font-size="12" font-weight="700" text-anchor="end" fill="#1A1A2E">Name the kind you mean</text>
  <text x="852" y="232" font-size="11" class="mono" text-anchor="end" fill="#6D28D9">memory_recall · sets types</text>
  <rect x="220" y="258" width="560" height="58" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="220" y="258" width="3.5" height="58" rx="1.75" fill="#7C3AED"/>
  <text x="240" y="281" class="lbl" fill="#7C3AED">ONE INDEX</text>
  <text x="240" y="302" font-size="12.5" fill="#1A1A2E">“Search only the payments index for refunds.”</text>
  <text x="762" y="281" font-size="12" font-weight="700" text-anchor="end" fill="#1A1A2E">Name the index</text>
  <text x="762" y="302" font-size="11" class="mono" text-anchor="end" fill="#6D28D9">memory_recall · sets index</text>
