<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .al { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#C084FC"/></marker>
    <marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/></marker>
    <marker id="ari" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1A2E"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Who can reach NeoHive</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">NO LOGINS. WHOEVER REACHES PORT 3577 CAN READ AND WRITE EVERYTHING.</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="740" y="120" width="220" height="280" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="756" y="142" class="lbl" fill="#7C3AED">NEOHIVE</text>
  <text x="756" y="164" class="title">Your instance</text>
  <text x="756" y="183" class="mono" font-size="11.5" fill="#6D28D9">port 3577</text>
  <text x="756" y="200" class="mono" font-size="11.5" fill="#6D28D9">plain HTTP</text>
  <text x="756" y="217" class="body">Dashboard and every</text>
  <text x="756" y="233" class="body">MCP endpoint on</text>
  <text x="756" y="249" class="body">the same port</text>
  <rect x="40" y="120" width="270" height="70" rx="10" fill="#FFFFFF" stroke="#99E6DC" stroke-width="1"/>
  <text x="56" y="142" class="title">This machine</text>
  <text x="56" y="161" class="mono" font-size="11.5" fill="#6D28D9">http://localhost:3577</text>
  <rect x="40" y="225" width="270" height="70" rx="10" fill="#FFFFFF" stroke="#F3D19C" stroke-width="1"/>
  <text x="56" y="247" class="title">Same network</text>
  <text x="56" y="266" class="mono" font-size="11.5" fill="#6D28D9">http://&lt;machine-ip&gt;:3577</text>
  <rect x="40" y="330" width="270" height="70" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="352" class="title">Outside your network</text>
  <text x="56" y="371" class="body">An agent on the internet</text>
  <rect x="410" y="330" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="426" y="352" class="lbl" fill="#7C3AED">YOU RUN THIS</text>
  <text x="426" y="374" class="title">Authenticating proxy</text>
  <path d="M310 155 L736 155" fill="none" stroke="#0D9488" stroke-width="2" marker-end="url(#art)"/>
  <text x="520" y="146" class="al" text-anchor="middle" style="fill:#0D9488">always</text>
  <path d="M310 260 L736 260" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#ara)"/>
  <text x="520" y="251" class="al" text-anchor="middle" style="fill:#B45309">open by default: firewall port 3577 if you work alone</text>
  <path d="M310 365 L406 365" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arv)"/>
  <text x="358" y="356" class="al" text-anchor="middle" style="fill:#7C3AED">HTTPS</text>
  <path d="M630 365 L736 365" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arv)"/>
  <text x="683" y="356" class="al" text-anchor="middle" style="fill:#7C3AED">login checked</text>
</svg>
