<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="408" viewBox="0 0 1000 408" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
    .al { font-size: 11px; font-weight: 600; fill: #7C3AED; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect width="1000" height="408" fill="#FAF9FD"/>

  <!-- Main path: Home, Hive page, Index page -->
  <rect x="40" y="40" width="240" height="120" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="56" y="62" class="lbl" fill="#7C3AED">HOME</text>
  <text x="56" y="84" class="title">Hives</text>
  <text x="56" y="103" class="mono" font-size="11.5" fill="#7008E7">/</text>
  <text x="56" y="122" class="body">Every Hive as a card,</text>
  <text x="56" y="138" class="body">with totals</text>

  <rect x="380" y="40" width="240" height="120" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="396" y="62" class="lbl" fill="#7C3AED">HIVE</text>
  <text x="396" y="84" class="title">Hive page</text>
  <text x="396" y="103" class="mono" font-size="11.5" fill="#7008E7">/hives/&lt;hive-id&gt;</text>
  <text x="396" y="122" class="body">Install Instructions, activity,</text>
  <text x="396" y="138" class="body">Indexes, Tool usage</text>

  <rect x="720" y="40" width="240" height="120" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="736" y="62" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="736" y="84" class="title">Index page</text>
  <text x="736" y="103" class="mono" font-size="10.5" fill="#7008E7">/hives/&lt;id&gt;/index/&lt;index-id&gt;</text>
  <text x="736" y="122" class="body">Showcase, Files, Sync Settings,</text>
  <text x="736" y="138" class="body">and Index Info tabs</text>

  <path d="M280 108 L376 108" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="82" class="al" text-anchor="middle">select a Hive</text>
  <text x="330" y="96" class="al" text-anchor="middle">card or entry</text>

  <path d="M620 108 L716 108" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="670" y="82" class="al" text-anchor="middle">select an</text>
  <text x="670" y="96" class="al" text-anchor="middle">Index row</text>

  <!-- Screens you reach from the sidebar, grouped -->
  <rect x="40" y="196" width="920" height="140" rx="5" fill="#F5F3FF" stroke="#DDD6FF"/>
  <text x="56" y="218" class="lbl" fill="#7C3AED">FROM THE SIDEBAR, ON ANY SCREEN</text>

  <rect x="56" y="232" width="284" height="88" rx="4" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="72" y="256" class="title">Create Hive</text>
  <text x="72" y="275" class="mono" font-size="11.5" fill="#7008E7">/hives/new</text>
  <text x="72" y="294" class="body">Name and set up a new Hive</text>

  <rect x="358" y="232" width="284" height="88" rx="4" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="374" y="256" class="title">Data Sources</text>
  <text x="374" y="275" class="mono" font-size="11.5" fill="#7008E7">/sources</text>
  <text x="374" y="294" class="body">GitHub and GitLab connections</text>

  <rect x="660" y="232" width="284" height="88" rx="4" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="676" y="256" class="title">Settings</text>
  <text x="676" y="275" class="mono" font-size="11.5" fill="#7008E7">/settings</text>
  <text x="676" y="294" class="body">License, telemetry, setup wizard</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="360" x2="960" y2="360" stroke="#E4DFF1"/>
  <g transform="translate(40,374) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="389" font-size="13" font-weight="700" fill="#1A1A2E">Dashboard map<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">THE MAIN SCREENS AND HOW YOU MOVE BETWEEN THEM</tspan></text>
</svg>
