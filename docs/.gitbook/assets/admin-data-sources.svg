<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="382" viewBox="0 0 1000 382" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .al { font-size: 11px; font-weight: 600; }
    .chip { font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
  </defs>
  <rect width="1000" height="382" fill="#FAF9FD"/>

  <!-- Account (outside NeoHive) -->
  <rect x="40" y="93" width="220" height="90" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-dasharray="6 4"/>
  <text x="56" y="115" class="lbl" fill="#737373">YOUR ACCOUNT</text>
  <text x="56" y="137" class="title">GitHub or GitLab</text>
  <text x="56" y="157" class="body">A token (PAT) or SSH key</text>

  <path d="M260 138 L346 138" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="303" y="129" class="al" text-anchor="middle" fill="#7C3AED">paste</text>

  <!-- Connection -->
  <rect x="350" y="93" width="270" height="90" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="366" y="115" class="lbl" fill="#7C3AED">CONNECTION</text>
  <text x="366" y="137" class="title">Work GitHub</text>
  <text x="366" y="157" class="body">Saved on Data Sources</text>

  <!-- Indexes -->
  <rect x="710" y="40" width="250" height="92" rx="5" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="726" y="62" class="lbl" fill="#A78BFA">INDEX</text>
  <text x="726" y="84" class="title">Code Index</text>
  <text x="726" y="104" class="body">Syncs through this connection</text>

  <rect x="710" y="144" width="250" height="92" rx="5" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="726" y="166" class="lbl" fill="#A78BFA">INDEX</text>
  <text x="726" y="188" class="title">Documentation Index</text>
  <text x="726" y="208" class="body">Syncs through this connection</text>

  <path d="M620 120 L706 90" fill="none" stroke="#009689" stroke-width="2" marker-end="url(#arrT)"/>
  <path d="M620 156 L706 186" fill="none" stroke="#009689" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="663" y="142" class="al" text-anchor="middle" fill="#009689">syncs</text>

  <!-- Caution: deleting a connection -->
  <rect x="40" y="250" width="920" height="54" rx="5" fill="#FFFFFF" stroke="#BB4D00" stroke-width="1.5"/>
  <text x="56" y="273" class="lbl" fill="#BB4D00">IF YOU DELETE A CONNECTION</text>
  <text x="56" y="292" class="body">Its Indexes keep their Memories, show a No connection badge, and stop syncing until you choose another connection.</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="334" x2="960" y2="334" stroke="#E4DFF1"/>
  <g transform="translate(40,348) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="363" font-size="13" font-weight="700" fill="#1A1A2E">Connections feed Indexes<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">ONE SAVED LOGIN CAN SYNC MANY INDEXES</tspan></text>
</svg>
