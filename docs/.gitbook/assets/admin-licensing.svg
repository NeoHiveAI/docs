<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="502" viewBox="0 0 1000 502" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 13px; font-weight: 600; fill: #1A1A2E; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .muted { font-size: 11.5px; fill: #737373; }
    .al { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A1A1A1"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#008236"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="502" fill="#FAF9FD"/>

  <rect x="40" y="40" width="420" height="50" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="65" r="11" fill="#7C3AED"/>
  <text x="68.5" y="69.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="92" y="62" class="mono" font-size="12.5" font-weight="600" fill="#1A1A2E">--license-file</text>
  <text x="92" y="79" class="muted">the path you pass to the installer</text>
  <path d="M250 94 L250 120" fill="none" stroke="#A1A1A1" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="262" y="111" class="muted">not found: next</text>
  <rect x="40" y="124" width="420" height="50" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="149" r="11" fill="#7C3AED"/>
  <text x="68" y="153.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="92" y="146" class="mono" font-size="12.5" font-weight="600" fill="#1A1A2E">NEOHIVE_LICENSE_FILE</text>
  <text x="92" y="163" class="muted">the path in this variable</text>
  <path d="M250 178 L250 204" fill="none" stroke="#A1A1A1" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="40" y="208" width="420" height="50" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="233" r="11" fill="#7C3AED"/>
  <text x="68" y="237.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="92" y="230" class="item">License file in this folder</text>
  <text x="92" y="247" class="muted">license.json or license.key</text>
  <path d="M250 262 L250 288" fill="none" stroke="#A1A1A1" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="40" y="292" width="420" height="50" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="317" r="11" fill="#7C3AED"/>
  <text x="68" y="321.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="92" y="314" class="item">Cached key</text>
  <text x="92" y="331" class="muted">saved by an earlier install</text>
  <path d="M250 346 L250 372" fill="none" stroke="#A1A1A1" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="40" y="376" width="420" height="50" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="401" r="11" fill="#7C3AED"/>
  <text x="68" y="405.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
  <text x="92" y="398" class="item">Prompt for a file path</text>
  <text x="92" y="415" class="muted">in an interactive terminal only</text>
  <path d="M470 65 L486 65 L486 401 L470 401" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <path d="M486 233 L556 233" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="521" y="224" class="al" text-anchor="middle" fill="#7C3AED">first found</text>
  <rect x="560" y="200" width="400" height="66" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="576" y="222" class="lbl" fill="#7C3AED">THEN</text>
  <text x="576" y="246" class="title">Check with the licensing service</text>
  <path d="M655 266 L655 292" fill="none" stroke="#008236" stroke-width="2" marker-end="url(#arrG)"/>
  <path d="M865 266 L865 292" fill="none" stroke="#BB4D00" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="560" y="296" width="190" height="88" rx="5" fill="#FFFFFF" stroke="#008236" stroke-width="1.5"/>
  <text x="576" y="318" class="lbl" fill="#008236">ACCEPTED</text>
  <text x="576" y="339" class="body">The installer caches</text>
  <text x="576" y="356" class="body">the key and carries on</text>
  <rect x="770" y="296" width="190" height="88" rx="5" fill="#FFFFFF" stroke="#BB4D00" stroke-width="1.5"/>
  <text x="786" y="318" class="lbl" fill="#BB4D00">REJECTED</text>
  <text x="786" y="339" class="body">Cache cleared. In a</text>
  <text x="786" y="356" class="body">terminal, it asks for</text>
  <text x="786" y="373" class="body">another file, up to 3 tries</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="454" x2="960" y2="454" stroke="#E4DFF1"/>
  <g transform="translate(40,468) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="483" font-size="13" font-weight="700" fill="#1A1A2E">Where the installer finds your license<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">IT CHECKS THESE IN ORDER AND USES THE FIRST ONE IT FINDS</tspan></text>
</svg>
