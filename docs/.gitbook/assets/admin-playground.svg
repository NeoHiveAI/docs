  <text x="750" y="296" class="body" style="fill:#1A1A2E" font-size="12.5">Type a query, then press</text>
  <text x="750" y="312" class="body" style="fill:#1A1A2E" font-size="12.5">Enter or click Run</text>
  <circle cx="730" cy="372" r="11" fill="#7C3AED"/>
