<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="310" viewBox="0 0 1000 310" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="310" fill="#FAF9FD"/>

  <!-- What you do -->
  <rect x="40" y="40" width="212" height="60" rx="5" fill="#FFFFFF" stroke="#BB4D00" stroke-width="1.5"/>
  <text x="56" y="61" class="lbl" fill="#BB4D00">YOU DO THIS</text>
  <text x="56" y="84" class="title">Run the installer again</text>
  <text x="272" y="75" class="muted">The installer then does these four steps on its own:</text>
  <path d="M140 100 L140 132" fill="none" stroke="#BB4D00" stroke-width="2" marker-end="url(#arrA)"/>

  <rect x="40" y="136" width="200" height="96" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="68" cy="164" r="11" fill="#7C3AED"/>
  <text x="68.5" y="168.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="88" y="169" class="title">Detect hardware</text>
  <text x="58" y="196" class="body">Picks GPU or CPU again</text>
  <path d="M240 184 L276 184" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="280" y="136" width="200" height="96" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="308" cy="164" r="11" fill="#7C3AED"/>
  <text x="308" y="168.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <text x="328" y="169" class="title">Pull the image</text>
  <text x="298" y="196" class="body">Latest release for</text>
  <text x="298" y="213" class="body">your hardware</text>
  <path d="M480 184 L516 184" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="520" y="136" width="200" height="96" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <circle cx="548" cy="164" r="11" fill="#7C3AED"/>
  <text x="548" y="168.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <text x="568" y="169" class="title">Remove the old one</text>
  <text x="538" y="196" class="body">Your data stays in the</text>
  <text x="538" y="213" class="body"><tspan class="mono" font-size="11.5" fill="#7008E7">neohive-data</tspan> volume</text>
  <path d="M720 184 L756 184" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="760" y="136" width="200" height="96" rx="5" fill="#FFFFFF" stroke="#BFF2D3"/>
  <circle cx="788" cy="164" r="11" fill="#008236"/>
  <text x="788" y="168.3" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <text x="808" y="169" class="title">Start the new one</text>
  <text x="778" y="196" class="body">On the same volume, then</text>
  <text x="778" y="213" class="body">prints what is new</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="262" x2="960" y2="262" stroke="#E4DFF1"/>
  <g transform="translate(40,276) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="291" font-size="13" font-weight="700" fill="#1A1A2E">What running the installer again does<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">YOUR DATA STAYS IN THE neohive-data VOLUME THE WHOLE TIME</tspan></text>
</svg>
