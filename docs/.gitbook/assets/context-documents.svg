<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="330" viewBox="0 0 1000 330" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A1A1A1"/></marker>
  </defs>

  <rect width="1000" height="330" fill="#FAF9FD"/>
  <!-- Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Add documents and PDFs</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#7008E7">WHAT HAPPENS TO A FILE YOU DROP ON A FILES INDEX</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="124" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="148" class="lbl" fill="#7C3AED">YOU UPLOAD</text>
  <text x="56" y="170" class="title mono">runbook.md</text>
  <text x="56" y="190" class="body">.md, .markdown, .txt</text>
  <text x="56" y="207" class="body">or .pdf, up to 10 MB</text>
  <rect x="270" y="124" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="286" y="148" class="lbl" fill="#7C3AED">PDF ONLY</text>
  <text x="286" y="170" class="title">Converted to text</text>
  <text x="286" y="190" class="body">takes longer: 5 minutes</text>
  <text x="286" y="207" class="body">allowed per PDF by default</text>
  <rect x="500" y="124" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="516" y="148" class="lbl" fill="#7C3AED">FILES INDEX</text>
  <text x="516" y="170" class="title">Made searchable</text>
  <text x="516" y="190" class="body">stored so your agent can</text>
  <text x="516" y="207" class="body">find it by meaning</text>
  <rect x="730" y="124" width="210" height="130" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="746" y="148" class="lbl" fill="#7C3AED">YOUR AGENT</text>
  <text x="746" y="170" class="title mono">memory_recall</text>
  <text x="746" y="190" class="body">gets back the section</text>
  <text x="746" y="207" class="body">that answers the question</text>
  <line x1="250" y1="189" x2="268" y2="189" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="189" x2="498" y2="189" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="189" x2="728" y2="189" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="40" y="296" class="muted">A file is searchable as soon as the Files tab shows it finished processing.</text>
</svg>
