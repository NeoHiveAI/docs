  <text x="600" y="68" class="muted">What each filter drops</text>
  <line x1="290" y1="88" x2="290" y2="110" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="112" width="500" height="54" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="71" cy="139" r="14" fill="#A1A1A1"/>
  <text x="71" y="143.5" class="item" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">1</text>
  <text x="94" y="144" class="title">Built-in skip list</text>
