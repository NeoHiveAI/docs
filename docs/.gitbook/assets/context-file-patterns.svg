<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="480" viewBox="0 0 1000 480" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A3A3A3"/></marker>
  </defs>

  <rect width="1000" height="480" fill="#FAF9FD"/>
  <!-- Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Which files get indexed</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">EVERY FILE PASSES THREE FILTERS, IN THIS ORDER</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40.0" y="116" width="920" height="50" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="60.0" y="147" class="title">Every file on the branch</text>
  <line x1="500" y1="166" x2="500" y2="180" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="100.0" y="180" width="800" height="50" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="120.0" y="211" class="title">1  Built-in skip list</text>
  <text x="880.0" y="210" class="body" text-anchor="end">binaries, images, lock files, node_modules, dist ... always on</text>
  <line x1="500" y1="230" x2="500" y2="244" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="160.0" y="244" width="680" height="50" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="180.0" y="275" class="title">2  Allowlist</text>
  <text x="820.0" y="274" class="body" text-anchor="end">when it has patterns, only matching files go on</text>
  <line x1="500" y1="294" x2="500" y2="308" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="220.0" y="308" width="560" height="50" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="240.0" y="339" class="title">3  Blocklist</text>
  <text x="760.0" y="338" class="body" text-anchor="end">matching files are removed, even allowlisted ones</text>
  <line x1="500" y1="358" x2="500" y2="372" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="280.0" y="372" width="440" height="50" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="300.0" y="403" class="title">Indexed</text>
  <text x="700.0" y="402" class="body" text-anchor="end">split, embedded, searchable</text>
  <text x="40" y="458" class="muted">You set 2 and 3 on the Sync Settings tab. 1 cannot be changed.</text>
</svg>
