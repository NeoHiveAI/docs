  <text x="618" y="233" class="body" style="fill:#737373">Files that don’t match, if it has patterns</text>
  <line x1="290" y1="248" x2="290" y2="270" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="272" width="500" height="54" rx="5" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="71" cy="299" r="14" fill="#7C3AED"/>
  <text x="71" y="303.5" class="item" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">3</text>
  <text x="94" y="304" class="title">Blocklist</text>
  <rect x="416.8" y="289" width="107.2" height="20" rx="3" fill="#F5F3FF" stroke="#DDD6FF" stroke-width="1"/>
  <text x="470.4" y="303" class="lbl" text-anchor="middle" style="fill:#7C3AED">YOU SET THIS</text>
  <line x1="544" y1="299" x2="594" y2="299" stroke="#A1A1A1" stroke-width="2" marker-end="url(#arrM)"/>
  <rect x="600" y="272" width="360" height="54" rx="5" fill="#FAF9FD" stroke="#E4DFF1" stroke-width="1"/>
  <text x="618" y="295" class="item" font-weight="700" style="fill:#4A4458">On the Blocklist</text>
  <text x="618" y="313" class="body" style="fill:#737373">Files that match, even allowlisted ones</text>
  <line x1="290" y1="328" x2="290" y2="350" stroke="#008236" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="40" y="352" width="500" height="50" rx="5" fill="#D9F7E5" stroke="#BFF2D3" stroke-width="1.5"/>
  <text x="60" y="383" class="title">Indexed</text>
  <text x="520" y="382" class="body" text-anchor="end">searchable by your agent</text>
