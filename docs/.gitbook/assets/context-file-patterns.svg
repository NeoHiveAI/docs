  <text x="64" y="497" font-size="13" font-weight="700" fill="#1A1A2E">Which files get indexed<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">EVERY FILE PASSES THREE FILTERS, IN THIS ORDER</tspan></text>
