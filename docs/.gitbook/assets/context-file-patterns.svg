  <text x="618" y="153" class="body" style="fill:#737373">binaries, images, lock files, <tspan class="mono" fill="#7008E7">node_modules</tspan>, <tspan class="mono" fill="#7008E7">dist</tspan> ...</text>
  <line x1="290" y1="168" x2="290" y2="190" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="192" width="500" height="54" rx="5" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="71" cy="219" r="14" fill="#7C3AED"/>
  <text x="71" y="223.5" class="item" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">2</text>
  <text x="94" y="224" class="title">Allowlist</text>
