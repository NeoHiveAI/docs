<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="343" viewBox="0 0 1000 343" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A1A1A1"/></marker>
  </defs>

  <rect width="1000" height="343" fill="#FAF9FD"/>

  <!-- Content keeps the coordinates it had under the old top header. This group moves it up by 89 so its
       top edge sits at y=40. Draw new content inside the group with the same coordinates as the rest. -->
  <g transform="translate(0,-89)">  <rect x="40" y="130" width="200" height="100" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="56" y="154" class="lbl" fill="#7C3AED">REPOSITORY</text>
  <text x="56" y="176" class="title">GitHub or GitLab</text>
  <text x="56" y="196" class="body">one branch, such as main</text>
  <rect x="280" y="130" width="200" height="100" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="296" y="154" class="lbl" fill="#7C3AED">CONNECTION</text>
  <text x="296" y="176" class="title">Token or SSH key</text>
  <text x="296" y="196" class="body">saved on Data Sources</text>
  <rect x="520" y="130" width="200" height="100" rx="5" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="536" y="154" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="536" y="176" class="title">Code</text>
  <text x="536" y="196" class="body">stored so your agent can</text>
  <text x="536" y="213" class="body">find it by meaning</text>
  <rect x="760" y="130" width="200" height="100" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="776" y="154" class="lbl" fill="#7C3AED">YOUR AGENT</text>
  <text x="776" y="176" class="title mono">memory_recall</text>
  <text x="776" y="196" class="body">finds code by what it does</text>
  <line x1="248" y1="190" x2="272" y2="190" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="488" y1="190" x2="512" y2="190" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="728" y1="190" x2="752" y2="190" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M140 230 L140 290 L250 290" fill="none" stroke="#009689" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M550 290 L620 290 L620 236" fill="none" stroke="#009689" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrT)"/>
  <rect x="250" y="272" width="300" height="36" rx="18" fill="#F0FDFA" stroke="#009689" stroke-width="1"/>
  <text x="400" y="295" class="item" text-anchor="middle">sync: every 4 hours, or Trigger sync</text>
  <text x="40" y="346" class="muted">Each sync reads only the files that changed since the last one.</text>
  </g>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="295" x2="960" y2="295" stroke="#E4DFF1"/>
  <g transform="translate(40,309) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="324" font-size="13" font-weight="700" fill="#1A1A2E">Add a code repository<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">A CONNECTION READS THE REPOSITORY. SYNCS KEEP THE INDEX CURRENT.</tspan></text>
</svg>
