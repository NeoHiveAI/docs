  <circle cx="356.667" cy="204" r="7" fill="#7C3AED"/>
  <text x="356.667" y="234" class="item mono" text-anchor="middle">08:00</text>
  <circle cx="500" cy="204" r="7" fill="#7C3AED"/>
  <text x="500" y="234" class="item mono" text-anchor="middle">12:00</text>
  <circle cx="643.333" cy="204" r="7" fill="#7C3AED"/>
  <text x="643.333" y="234" class="item mono" text-anchor="middle">16:00</text>
  <circle cx="786.667" cy="204" r="7" fill="#7C3AED"/>
  <text x="786.667" y="234" class="item mono" text-anchor="middle">20:00</text>
  <circle cx="930" cy="204" r="7" fill="#7C3AED"/>
  <text x="930" y="234" class="item mono" text-anchor="middle">24:00</text>
  <rect x="428.5" y="197" width="14" height="14" fill="#BB4D00" transform="rotate(45 435.5 204)"/>
  <line x1="435.5" y1="192" x2="435.5" y2="164" stroke="#BB4D00" stroke-width="1.5"/>
  <rect x="295.5" y="108" width="280" height="56" rx="5" fill="#FFF5E6" stroke="#FFE1B2" stroke-width="1.5"/>
  <text x="311.5" y="131" class="item mono" style="fill:#BB4D00" font-weight="600">10:12</text>
  <text x="357.5" y="131" class="item" font-weight="700">You select Trigger sync</text>
  <text x="311.5" y="151" class="muted">runs right away, reads only what changed</text>
  <rect x="586.167" y="197" width="14" height="14" fill="#009689"/>
  <line x1="593.167" y1="216" x2="593.167" y2="250" stroke="#009689" stroke-width="1.5"/>
  <rect x="453.167" y="250" width="280" height="56" rx="5" fill="#F0FDFA" stroke="#99E6DC" stroke-width="1.5"/>
  <text x="469.167" y="273" class="item mono" style="fill:#009689" font-weight="600">14:36</text>
  <text x="515.167" y="273" class="item" font-weight="700">CI calls the webhook after a merge</text>
  <text x="469.167" y="293" class="muted">sends only the changed files</text>
  <text x="40" y="352" class="muted">Only one sync runs per Index at a time. Each one processes only what changed.</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="376" x2="960" y2="376" stroke="#E4DFF1"/>
  <g transform="translate(40,390) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
