  <circle cx="500.0" cy="230" r="7" fill="#7C3AED"/>
  <text x="500.0" y="260" class="item mono" text-anchor="middle">12:00</text>
  <circle cx="643.3333333333334" cy="230" r="7" fill="#7C3AED"/>
  <text x="643.3333333333334" y="260" class="item mono" text-anchor="middle">16:00</text>
  <circle cx="786.6666666666666" cy="230" r="7" fill="#7C3AED"/>
  <text x="786.6666666666666" y="260" class="item mono" text-anchor="middle">20:00</text>
  <circle cx="930.0" cy="230" r="7" fill="#7C3AED"/>
  <text x="930.0" y="260" class="item mono" text-anchor="middle">24:00</text>
  <text x="70.0" y="208" class="muted" text-anchor="start">scheduled</text>
  <rect x="428.5" y="223" width="14" height="14" fill="#B45309" transform="rotate(45 435.5 230)"/>
  <line x1="435.5" y1="218" x2="435.5" y2="172" stroke="#B45309" stroke-width="1.5"/>
  <rect x="325.5" y="120" width="220" height="50" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1"/>
  <text x="435.5" y="141" class="item" text-anchor="middle" font-weight="700">You click Trigger sync</text>
  <text x="435.5" y="159" class="muted" text-anchor="middle">runs now, same changed-files rules</text>
  <rect x="586.1666666666666" y="223" width="14" height="14" fill="#0D9488"/>
  <line x1="593.1666666666666" y1="242" x2="593.1666666666666" y2="282" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="473.16666666666663" y="290" width="240" height="50" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
  <text x="593.1666666666666" y="311" class="item" text-anchor="middle" font-weight="700">CI calls the webhook after a merge</text>
  <text x="593.1666666666666" y="329" class="muted" text-anchor="middle">sends only the changed files</text>
  <text x="40" y="380" class="muted">Only one sync runs per Index at a time. Each one processes only what changed.</text>
</svg>
