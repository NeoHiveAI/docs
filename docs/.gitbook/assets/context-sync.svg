<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="424" viewBox="0 0 1000 424" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#008236"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A1A1A1"/></marker>
  </defs>
  <rect width="1000" height="424" fill="#FAF9FD"/>

  <rect x="40" y="40" width="920" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="64" cy="62" r="6" fill="#7C3AED"/>
  <text x="80" y="66" class="item"><tspan font-weight="700">Scheduled sync</tspan><tspan dx="10" style="fill:#737373" font-size="11.5">every 4 hours, automatic</tspan></text>
  <rect x="358.5" y="56.5" width="11" height="11" fill="#BB4D00" transform="rotate(45 364 62)"/>
  <text x="380" y="66" class="item"><tspan font-weight="700">Trigger sync</tspan><tspan dx="10" style="fill:#737373" font-size="11.5">you start it from the Index page</tspan></text>
  <rect x="658.5" y="56.5" width="11" height="11" fill="#009689"/>
  <text x="680" y="66" class="item"><tspan font-weight="700">Webhook</tspan><tspan dx="10" style="fill:#737373" font-size="11.5">your CI starts it after a merge</tspan></text>
  <line x1="70" y1="204" x2="930" y2="204" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="70" cy="204" r="7" fill="#7C3AED"/>
