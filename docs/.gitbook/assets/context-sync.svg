  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Three ways changes reach an Index</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">ONE DAY WITH THE DEFAULT SCHEDULE OF EVERY 4 HOURS</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <line x1="70" y1="230" x2="930" y2="230" stroke="#A78BFA" stroke-width="2"/>
  <circle cx="70.0" cy="230" r="7" fill="#7C3AED"/>
  <text x="70.0" y="260" class="item mono" text-anchor="middle">00:00</text>
  <circle cx="213.33333333333334" cy="230" r="7" fill="#7C3AED"/>
  <text x="213.33333333333334" y="260" class="item mono" text-anchor="middle">04:00</text>
  <circle cx="356.6666666666667" cy="230" r="7" fill="#7C3AED"/>
