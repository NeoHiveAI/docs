<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 12px; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A3A3A3"/></marker>
  </defs>

  <rect width="1000" height="560" fill="#FAF9FD"/>
  <!-- Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">What to add, and where</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">ANSWER TOP TO BOTTOM. THE FIRST YES TELLS YOU WHAT TO ADD.</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="118" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="60" y="148" class="lbl" fill="#7C3AED">QUESTION 1</text>
  <text x="60" y="174" class="title">Has another Hive already indexed it?</text>
  <line x1="480" y1="160" x2="574" y2="160" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="527" y="152" class="muted" text-anchor="middle">yes</text>
  <rect x="580" y="118" width="380" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="148" class="title">Shared Index</text>
  <text x="600" y="168" class="body">Reuse it. Nothing is copied</text>
  <text x="600" y="185" class="body">and no indexing runs.</text>
  <line x1="120" y1="202" x2="120" y2="224" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="132" y="219" class="muted">no</text>
  <rect x="40" y="226" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="60" y="256" class="lbl" fill="#7C3AED">QUESTION 2</text>
  <text x="60" y="282" class="title">Is it in a GitHub or GitLab repository?</text>
  <line x1="480" y1="268" x2="574" y2="268" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="527" y="260" class="muted" text-anchor="middle">yes</text>
  <rect x="580" y="226" width="380" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="256" class="title">Code or Documentation</text>
  <text x="600" y="276" class="body">Code for source files,</text>
  <text x="600" y="293" class="body">Documentation for markdown docs.</text>
  <line x1="120" y1="310" x2="120" y2="332" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="132" y="327" class="muted">no</text>
  <rect x="40" y="334" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="60" y="364" class="lbl" fill="#7C3AED">QUESTION 3</text>
  <text x="60" y="390" class="title">Is it a file you have, such as a PDF?</text>
  <line x1="480" y1="376" x2="574" y2="376" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="527" y="368" class="muted" text-anchor="middle">yes</text>
  <rect x="580" y="334" width="380" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="600" y="364" class="title">Files</text>
  <text x="600" y="384" class="body">Pick File Upload and drop</text>
  <text x="600" y="401" class="body">.md, .txt or .pdf files.</text>
  <line x1="120" y1="418" x2="120" y2="440" stroke="#A3A3A3" stroke-width="2" marker-end="url(#arrM)"/>
  <text x="132" y="435" class="muted">no</text>
  <rect x="40" y="442" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="60" y="472" class="lbl" fill="#7C3AED">QUESTION 4</text>
  <text x="60" y="498" class="title">Is it something the team decides or learns?</text>
  <line x1="480" y1="484" x2="574" y2="484" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="527" y="476" class="muted" text-anchor="middle">yes</text>
  <rect x="580" y="442" width="380" height="84" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="600" y="472" class="title">Knowledge</text>
  <text x="600" y="492" class="body">Nothing to add. Every Hive has</text>
  <text x="600" y="509" class="body">one, and your agent writes to it.</text>
</svg>
