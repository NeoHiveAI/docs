<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="420" viewBox="0 0 1000 420" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 13px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#FAF9FD"/>

  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Connect your agent</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">TWO PIECES: THE MCP ENDPOINT AND THE PLUGIN</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>

  <!-- Agent -->
  <rect x="40" y="116" width="380" height="270" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="62" y="144" class="lbl" fill="#7C3AED">YOUR EDITOR OR TERMINAL</text>
  <text x="62" y="168" class="title">Your agent</text>
  <text x="62" y="188" class="body">Claude Code, Cursor, Codex, Claude Desktop, ...</text>

  <rect x="58" y="206" width="344" height="160" rx="10" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="76" y="232" class="lbl" fill="#7C3AED">2  PLUGIN</text>
  <text x="76" y="254" class="title">Tells the agent when to use NeoHive</text>
  <text x="76" y="276" class="body">A rules file plus setup skills.</text>
  <text x="76" y="296" class="body">Recall before exploring, store what you teach.</text>
  <text x="76" y="330" font-size="12" fill="#737373">Recommended. Available for Claude Code,</text>
  <text x="76" y="348" font-size="12" fill="#737373">Cursor and Codex.</text>

  <!-- Endpoint arrow -->
  <line x1="424" y1="236" x2="576" y2="236" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrV)" marker-start="url(#arrV)"/>
  <text x="500" y="206" font-size="12" font-weight="700" letter-spacing="1.1" text-anchor="middle" fill="#7C3AED">1  MCP ENDPOINT</text>
  <text x="500" y="222" font-size="11.5" text-anchor="middle" fill="#737373">required</text>
  <text x="500" y="262" font-size="12" text-anchor="middle" fill="#4A4458">gives the agent</text>
  <text x="500" y="278" font-size="12" text-anchor="middle" fill="#4A4458">the memory tools</text>

  <!-- Hive -->
  <rect x="580" y="116" width="380" height="270" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="602" y="144" class="lbl" fill="#7C3AED">NEOHIVE ON YOUR MACHINE</text>
  <text x="602" y="168" class="title">One hive</text>
  <text x="602" y="188" class="mono" font-size="12" fill="#6D28D9">http://localhost:3577/hives/&lt;hive-id&gt;/mcp</text>

  <rect x="602" y="212" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="682" y="239" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1A1A2E">Code</text>
  <rect x="778" y="212" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="858" y="239" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1A1A2E">Documentation</text>
  <rect x="602" y="268" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="682" y="295" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1A1A2E">Files</text>
  <rect x="778" y="268" width="160" height="44" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="858" y="295" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1A1A2E">Knowledge</text>
  <text x="602" y="350" font-size="12" fill="#737373">The endpoint reaches every index in the hive.</text>
</svg>
