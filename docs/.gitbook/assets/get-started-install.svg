<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="330" viewBox="0 0 1000 330" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 13px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FAF9FD"/>

  <!-- Header. Logo paths copied verbatim from get-started-connect.svg. -->
    <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Install NeoHive</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">ONE COMMAND, THEN THREE STEPS IN THE DASHBOARD</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>

  <!-- Terminal -->
  <text x="40" y="126" class="lbl" fill="#7C3AED">IN YOUR TERMINAL</text>
  <rect x="40" y="140" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="58" y="168" class="lbl" fill="#7C3AED">1</text>
  <text x="58" y="190" class="title">Run the installer</text>
  <text x="58" y="214" class="body">Reads your license file</text>
  <text x="58" y="234" class="body">and starts the container.</text>
  <text x="58" y="262" class="mono" font-size="11.5" fill="#6D28D9">localhost:3577</text>

  <line x1="246" y1="210" x2="286" y2="210" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrV)"/>

  <!-- Dashboard setup -->
  <text x="292" y="126" class="lbl" fill="#7C3AED">IN THE DASHBOARD SETUP</text>
  <rect x="292" y="140" width="668" height="140" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>

  <rect x="308" y="156" width="196" height="108" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="324" y="180" class="lbl" fill="#7C3AED">2</text>
  <text x="324" y="202" class="title">Name Hive</text>
  <text x="324" y="226" class="body">Your team's workspace,</text>
  <text x="324" y="246" class="body">with one MCP endpoint.</text>

  <line x1="508" y1="210" x2="526" y2="210" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrV)"/>

  <rect x="530" y="156" width="196" height="108" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="546" y="180" class="lbl" fill="#7C3AED">3</text>
  <text x="546" y="202" class="title">Configure first Index</text>
  <text x="546" y="226" class="body">GitHub, GitLab,</text>
  <text x="546" y="246" class="body">or File Upload.</text>

  <line x1="730" y1="210" x2="748" y2="210" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrV)"/>

  <rect x="752" y="156" width="192" height="108" rx="10" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="768" y="180" class="lbl" fill="#7C3AED">4</text>
  <text x="768" y="202" class="title" style="font-size:13.5px">Install for your AI tools</text>
  <text x="768" y="226" class="body">Connect your agent.</text>
  <text x="768" y="246" class="body">Setup shows Connected.</text>

  <text x="40" y="310" font-size="12" fill="#737373">Every Hive also gets a Knowledge Index for what your agent learns. You add more Indexes later.</text>
</svg>
