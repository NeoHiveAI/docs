<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="480" viewBox="0 0 1000 480" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12px; fill: #4A4458; }
    .title { font-size: 16px; font-weight: 700; fill: #1A1A2E; }
    .item { font-size: 10.5px; fill: #1A1A2E; }
    .tag { font-size: 9px; font-weight: 700; letter-spacing: 0.8px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#FAF9FD"/>

  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">The parts of NeoHive</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#7008E7">THE SERVER HOLDS HIVES. A HIVE HOLDS INDEXES. THE KNOWLEDGE INDEX HOLDS MEMORIES.</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>

  <!-- Agent with its plugin -->
  <rect x="40" y="116" width="226" height="300" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="60" y="142" class="lbl" fill="#7C3AED">YOUR AGENT</text>
  <text x="60" y="166" class="title">Coding agent</text>
  <text x="60" y="186" class="body">Claude Code, Cursor, or Codex</text>

  <rect x="58" y="204" width="190" height="146" rx="10" fill="#F5F3FF" stroke="#DDD6FF"/>
  <text x="74" y="228" class="lbl" fill="#7C3AED">PLUGIN</text>
  <text x="74" y="250" font-size="14" font-weight="700" fill="#1A1A2E">NeoHive plugin</text>
  <text x="74" y="274" class="body">Rules and skills that tell</text>
  <text x="74" y="292" class="body">the agent when to use</text>
  <text x="74" y="310" class="body">NeoHive, so you do not</text>
  <text x="74" y="328" class="body">have to ask.</text>

  <!-- Server -->
  <rect x="330" y="116" width="630" height="300" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="352" y="142" class="lbl" fill="#7C3AED">SERVER</text>
  <text x="352" y="166" class="title">Docker container</text>
  <text x="938" y="142" font-size="11" text-anchor="end" fill="#737373">dashboard</text>
  <text x="938" y="166" font-size="11.5" class="mono" text-anchor="end" fill="#7008E7">http://localhost:3577</text>

  <!-- Hive -->
  <rect x="352" y="184" width="586" height="214" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="368" y="206" class="lbl" fill="#7C3AED">HIVE</text>
  <text x="410" y="206" font-size="12.5" font-weight="600" fill="#1A1A2E">A workspace for one codebase or team</text>
  <text x="922" y="206" font-size="11" class="mono" text-anchor="end" fill="#7008E7">/hives/&lt;hive-id&gt;/mcp</text>

  <!-- Indexes -->
  <rect x="368" y="222" width="128" height="160" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="380" y="242" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="380" y="262" font-size="13" font-weight="700" fill="#1A1A2E">Code</text>
  <text x="380" y="279" font-size="11" fill="#4A4458">from a repository</text>
  <rect x="380" y="292" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="388" y="311" class="item mono">auth.ts</text>
  <rect x="380" y="330" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="388" y="349" class="item mono">routes.ts</text>

  <rect x="510" y="222" width="128" height="160" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="522" y="242" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="522" y="262" font-size="13" font-weight="700" fill="#1A1A2E">Documentation</text>
  <text x="522" y="279" font-size="11" fill="#4A4458">repository docs</text>
  <rect x="522" y="292" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="530" y="311" class="item mono">deploy.md</text>
  <rect x="522" y="330" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="530" y="349" class="item mono">adr-007.md</text>

  <rect x="652" y="222" width="128" height="160" rx="8" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="664" y="242" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="664" y="262" font-size="13" font-weight="700" fill="#1A1A2E">Files</text>
  <text x="664" y="279" font-size="11" fill="#4A4458">files you upload</text>
  <rect x="664" y="292" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="672" y="311" class="item mono">runbook.pdf</text>
  <rect x="664" y="330" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="672" y="349" class="item mono">notes.md</text>

  <rect x="794" y="222" width="128" height="160" rx="8" fill="#FFFFFF" stroke="#C084FC" stroke-width="1.5"/>
  <text x="806" y="242" class="lbl" fill="#7C3AED">INDEX</text>
  <text x="806" y="262" font-size="13" font-weight="700" fill="#1A1A2E">Knowledge</text>
  <text x="806" y="279" font-size="11" fill="#4A4458">one per Hive</text>
  <rect x="806" y="292" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#C084FC"/>
  <text x="814" y="304" class="tag" fill="#009689">MEMORY</text>
  <text x="814" y="317" class="item">Use pnpm</text>
  <rect x="806" y="330" width="104" height="30" rx="6" fill="#FAF9FD" stroke="#C084FC"/>
  <text x="814" y="342" class="tag" fill="#009689">MEMORY</text>
  <text x="814" y="355" class="item">Queue retries</text>

  <!-- Agent to the server over MCP. The arrow stops at the server box edge so it crosses no other element. -->
  <line x1="266" y1="226" x2="328" y2="226" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="298" y="216" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1A1A2E">MCP</text>

  <!-- Footer -->
  <line x1="40" y1="436" x2="960" y2="436" stroke="#E4DFF1"/>
  <text x="40" y="460" font-size="11.5" fill="#737373">Your agent calls a Hive through its MCP endpoint. Every Index in the Hive is searched together, and new Memories go to the Knowledge Index.</text>
</svg>
