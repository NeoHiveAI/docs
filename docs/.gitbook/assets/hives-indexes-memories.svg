<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="448" viewBox="0 0 1000 448" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
