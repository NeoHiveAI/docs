<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="440" viewBox="0 0 1000 440" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 16px; font-weight: 700; fill: #1A1A2E; }
    .muted { font-size: 11.5px; fill: #737373; }
    .chip { font-size: 11px; font-weight: 600; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#FAF9FD"/>

  <!-- Left: the agent, with the plugin inside it -->
  <rect x="40" y="40" width="330" height="250" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="62" y="68" class="lbl" fill="#7C3AED">YOUR EDITOR OR TERMINAL</text>
  <text x="62" y="92" class="title">Coding agent</text>
  <text x="62" y="112" class="muted">Claude Code, Cursor, Codex, Claude Desktop</text>

  <rect x="58" y="132" width="294" height="76" rx="4" fill="#F5F3FF" stroke="#DDD6FF"/>
  <text x="74" y="157" font-size="13.5" font-weight="700" fill="#1A1A2E">NeoHive plugin</text>
  <text x="74" y="176" class="muted">Rules and hooks</text>
  <text x="74" y="194" class="muted">Claude Code, Cursor, Codex</text>

  <!-- Agent to container -->
  <line x1="370" y1="150" x2="526" y2="150" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="448" y="140" font-size="12" font-weight="700" text-anchor="middle" fill="#1A1A2E">MCP</text>
  <text x="448" y="168" font-size="10.5" class="mono" text-anchor="middle" fill="#737373">tool calls</text>

  <!-- Right: the container, what it serves, and the Hive it holds -->
  <rect x="530" y="40" width="430" height="250" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="552" y="68" class="lbl" fill="#7C3AED">DOCKER, ON YOUR MACHINE OR A SHARED SERVER</text>
  <text x="552" y="92" class="title">NeoHive container</text>

  <rect x="552" y="106" width="190" height="40" rx="4" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="647" y="131" font-size="13" font-weight="700" text-anchor="middle" fill="#1A1A2E">MCP endpoint</text>
  <rect x="750" y="106" width="190" height="40" rx="4" fill="#FAF9FD" stroke="#E5E5E5"/>
  <text x="845" y="131" font-size="13" font-weight="700" text-anchor="middle" fill="#1A1A2E">Dashboard</text>

  <rect x="552" y="160" width="388" height="112" rx="5" fill="#F5F3FF" stroke="#DDD6FF"/>
  <text x="568" y="184" class="lbl" fill="#7C3AED">HIVE</text>
  <rect x="568" y="200" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="610" y="226" class="chip" text-anchor="middle">Code</text>
  <rect x="659" y="200" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="701" y="226" class="chip" text-anchor="middle" font-size="9.5">Documentation</text>
  <rect x="750" y="200" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="792" y="226" class="chip" text-anchor="middle">Files</text>
  <rect x="841" y="200" width="84" height="44" rx="4" fill="#FFFFFF" stroke="#C084FC"/>
  <text x="883" y="226" class="chip" text-anchor="middle">Knowledge</text>

  <!-- Below: what feeds the container, and who manages it -->
  <rect x="552" y="334" width="180" height="46" rx="5" fill="#FFFFFF" stroke="#99E6DC"/>
  <text x="642" y="362" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A1A2E">GitHub or GitLab</text>
  <line x1="642" y1="334" x2="642" y2="292" stroke="#009689" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="652" y="317" font-size="11" class="mono" fill="#009689">clone and sync</text>

  <rect x="760" y="334" width="180" height="46" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="850" y="362" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1A1A2E">Your browser</text>
  <line x1="850" y1="334" x2="850" y2="292" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="860" y="317" font-size="11" class="mono" fill="#7C3AED">manage</text>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="392" x2="960" y2="392" stroke="#E4DFF1"/>
  <g transform="translate(40,406) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="421" font-size="13" font-weight="700" fill="#1A1A2E">How NeoHive works<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">YOUR AGENT TALKS MCP TO ONE CONTAINER THAT HOLDS YOUR CONTEXT</tspan></text>
</svg>
