<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .code { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #6D28D9; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#FAF9FD"/>

  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Webhook refresh</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">ONE REQUEST FROM CI UPDATES EVERY INDEX THAT SYNCS THE REPOSITORY</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>

  <!-- 1 CI -->
  <rect x="40" y="124" width="160" height="128" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="58" y="150" class="lbl" fill="#7C3AED">1 · YOUR CI</text>
  <text x="58" y="174" class="title">Collect changes</text>
  <text x="58" y="196" class="body">Changed files as</text>
  <text x="58" y="214" class="body">base64, deleted files</text>
  <text x="58" y="232" class="body">as a path only</text>

  <!-- 2 POST -->
  <rect x="230" y="124" width="160" height="128" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="248" y="150" class="lbl" fill="#7C3AED">2 · REQUEST</text>
  <text x="248" y="174" class="title">POST to the Hive</text>
  <text x="248" y="196" class="code">/hives/&lt;hive-id&gt;/</text>
  <text x="248" y="214" class="code">webhook/refresh</text>
  <text x="248" y="234" class="body">at most 100 KB</text>

  <!-- 3 Secret -->
  <rect x="420" y="124" width="160" height="128" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="438" y="150" class="lbl" fill="#7C3AED">3 · NEOHIVE</text>
  <text x="438" y="174" class="title">Check the secret</text>
  <text x="438" y="196" class="code">X-Webhook-Secret</text>
  <text x="438" y="214" class="body">must equal</text>
  <text x="438" y="232" class="code" style="font-size:10.5px">MEMVEC_WEBHOOK_SECRET</text>

  <!-- 4 Match -->
  <rect x="610" y="124" width="160" height="128" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="628" y="150" class="lbl" fill="#7C3AED">4 · NEOHIVE</text>
  <text x="628" y="174" class="title">Find the Indexes</text>
  <text x="628" y="196" class="body">Every Index in the</text>
  <text x="628" y="214" class="body">Hive that syncs the</text>
  <text x="628" y="232" class="body">exact <tspan class="code">repo</tspan> URL</text>

  <!-- 5 Update -->
  <rect x="800" y="124" width="160" height="128" rx="12" fill="#FFFFFF" stroke="#99E6DC"/>
  <rect x="800" y="124" width="3.5" height="128" rx="1.75" fill="#0D9488"/>
  <text x="818" y="150" class="lbl" fill="#0D9488">5 · PER FILE</text>
  <text x="818" y="174" class="title">Update the Index</text>
  <text x="818" y="196" class="body">Remove the path's old</text>
  <text x="818" y="214" class="body">content, then index</text>
  <text x="818" y="232" class="body">the new content</text>

  <!-- Forward arrows -->
  <line x1="200" y1="188" x2="228" y2="188" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="390" y1="188" x2="418" y2="188" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="580" y1="188" x2="608" y2="188" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="770" y1="188" x2="798" y2="188" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Failure exits -->
  <line x1="500" y1="252" x2="500" y2="284" stroke="#B45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
  <text x="500" y="302" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B45309">401 if it does not</text>
  <line x1="690" y1="252" x2="690" y2="284" stroke="#B45309" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrA)"/>
  <text x="690" y="302" font-size="12.5" font-weight="700" text-anchor="middle" fill="#B45309">404 if none match</text>

  <!-- Reply -->
  <path d="M880 252 L880 348 L676 348" fill="none" stroke="#0D9488" stroke-width="1.8"/>
  <path d="M324 348 L120 348 L120 254" fill="none" stroke="#0D9488" stroke-width="1.8" marker-end="url(#arrT)"/>
  <text x="500" y="353" font-size="12.5" text-anchor="middle" fill="#0D9488"><tspan font-weight="700">Reply:</tspan> <tspan class="mono" font-size="11.5">processed · skipped · deleted · errors</tspan></text>
</svg>
