<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="282" viewBox="0 0 1000 282" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="282" fill="#FAF9FD"/>

  <!-- Content keeps the coordinates it had under the old top header. This group moves it up by 82 so its
       top edge sits at y=40. Draw new content inside the group with the same coordinates as the rest. -->
  <g transform="translate(0,-82)">  <line x1="120" y1="140" x2="880" y2="140" stroke="#D9D4E6" stroke-width="2"/>
  <circle cx="147.5" cy="140" r="18" fill="#7C3AED"/>
  <text x="147.5" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <rect x="40" y="176" width="215" height="116" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="58" y="202" class="lbl" fill="#7C3AED">START</text>
  <text x="237" y="202" font-size="10" font-weight="700" letter-spacing="0.8" text-anchor="end" fill="#009689">AUTOMATIC</text>
  <text x="58" y="228" class="title">Session opens</text>
  <text x="58" y="252" class="body">Plugin reminds your agent</text>
  <text x="58" y="270" class="body">to load context for the task</text>
  <circle cx="382.5" cy="140" r="18" fill="#7C3AED"/>
  <text x="382.5" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
  <rect x="275" y="176" width="215" height="116" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="293" y="202" class="lbl" fill="#7C3AED">WORK</text>
  <text x="472" y="202" font-size="10" font-weight="700" letter-spacing="0.8" text-anchor="end" fill="#009689">AUTOMATIC</text>
  <text x="293" y="228" class="title">Each prompt you send</text>
  <text x="293" y="252" class="body">Plugin adds the best matches,</text>
  <text x="293" y="270" class="body">and the agent recalls more</text>
  <circle cx="617.5" cy="140" r="18" fill="#7C3AED"/>
  <text x="617.5" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
  <rect x="510" y="176" width="215" height="116" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="528" y="202" class="lbl" fill="#7C3AED">TEACH</text>
  <text x="707" y="202" font-size="10" font-weight="700" letter-spacing="0.8" text-anchor="end" fill="#BB4D00">YOU DO THIS</text>
  <text x="528" y="228" class="title">You correct it</text>
  <text x="528" y="252" class="body">Say what is right and why,</text>
  <text x="528" y="270" class="body">and the agent stores it</text>
  <circle cx="852.5" cy="140" r="18" fill="#7C3AED"/>
  <text x="852.5" y="146" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
  <rect x="745" y="176" width="215" height="116" rx="5" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="763" y="202" class="lbl" fill="#7C3AED">CAPTURE</text>
  <text x="942" y="202" font-size="10" font-weight="700" letter-spacing="0.8" text-anchor="end" fill="#BB4D00">YOU DO THIS</text>
  <text x="763" y="228" class="title">Before you close</text>
  <text x="763" y="252" class="body">Run the skill to save up</text>
  <text x="763" y="270" class="body">to five new Memories</text>
  </g>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="234" x2="960" y2="234" stroke="#E4DFF1"/>
  <g transform="translate(40,248) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="263" font-size="13" font-weight="700" fill="#1A1A2E">A session, start to finish<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">FOUR STAGES · TWO RUN ON THEIR OWN IN CLAUDE CODE, TWO ARE YOURS</tspan></text>
</svg>
