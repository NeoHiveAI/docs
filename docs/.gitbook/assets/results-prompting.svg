<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="380" viewBox="0 0 1000 380" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#008236"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Write prompts that retrieve well</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#7008E7">A QUERY FINDS A MEMORY BY THE WORDS AND MEANING THEY SHARE</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="124" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#FFE1B2"/>
  <rect x="40" y="124" width="3.5" height="100" rx="1.75" fill="#BB4D00"/>
  <text x="62" y="152" class="lbl" fill="#BB4D00">WRONG WAY · YOUR QUERY</text>
  <text x="62" y="186" font-size="13" class="mono" fill="#1A1A2E">How do we handle errors?</text>
  <line x1="378" y1="174" x2="582" y2="174" stroke="#BB4D00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="480" y="164" font-size="11.5" font-weight="700" text-anchor="middle" fill="#BB4D00">few shared words</text>
  <text x="480" y="194" font-size="11" text-anchor="middle" fill="#737373">weaker match</text>
  <rect x="590" y="124" width="370" height="100" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="612" y="152" class="lbl" fill="#7C3AED">STORED MEMORY</text>
  <text x="612" y="180" font-size="13" fill="#1A1A2E">The batch processor retries failed jobs</text>
  <text x="612" y="200" font-size="13" fill="#1A1A2E">up to 3 times with exponential backoff.</text>
  <rect x="40" y="250" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#BFF2D3"/>
  <rect x="40" y="250" width="3.5" height="100" rx="1.75" fill="#008236"/>
  <text x="62" y="278" class="lbl" fill="#008236">RIGHT WAY · YOUR QUERY</text>
  <text x="62" y="306" font-size="13" class="mono" fill="#1A1A2E">error handling and <tspan fill="#7C3AED" font-weight="600">retries</tspan> in</text>
  <text x="62" y="326" font-size="13" class="mono" fill="#1A1A2E">the async <tspan fill="#7C3AED" font-weight="600">batch processor</tspan></text>
  <line x1="378" y1="300" x2="582" y2="300" stroke="#008236" stroke-width="2"  marker-end="url(#arrG)"/>
  <text x="480" y="290" font-size="11.5" font-weight="700" text-anchor="middle" fill="#008236">shares: batch processor, retries</text>
  <text x="480" y="320" font-size="11" text-anchor="middle" fill="#737373">strong match</text>
  <rect x="590" y="250" width="370" height="100" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="612" y="278" class="lbl" fill="#7C3AED">STORED MEMORY</text>
  <text x="612" y="306" font-size="13" fill="#1A1A2E">The <tspan fill="#7C3AED" font-weight="700">batch processor</tspan> <tspan fill="#7C3AED" font-weight="700">retries</tspan> failed jobs</text>
  <text x="612" y="326" font-size="13" fill="#1A1A2E">up to 3 times with exponential backoff.</text>
</svg>
