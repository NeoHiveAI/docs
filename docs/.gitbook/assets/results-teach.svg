<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="330" viewBox="0 0 1000 330" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FAF9FD"/>
  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Teach your agent as you work</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#7008E7">ONE CORRECTION, STORED ONCE, RETURNS IN EVERY LATER SESSION ON THE HIVE</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="124" width="270" height="180" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="40" y="124" width="3.5" height="180" rx="1.75" fill="#7C3AED"/>
  <text x="62" y="152" class="lbl" fill="#7C3AED">YOUR SESSION, TODAY</text>
  <text x="62" y="178" class="title">You say</text>
  <text x="62" y="204" font-size="13" fill="#1A1A2E">No, we validate tokens in the</text>
  <text x="62" y="224" font-size="13" fill="#1A1A2E">gateway, not in each service.</text>
  <line x1="62" y1="248" x2="288" y2="248" stroke="#EEEAF6"/>
  <text x="62" y="276" font-size="11.5" class="mono" fill="#7008E7">agent calls memory_store</text>
  <rect x="365" y="124" width="270" height="180" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="365" y="124" width="3.5" height="180" rx="1.75" fill="#C084FC"/>
  <text x="387" y="152" class="lbl" fill="#C084FC">KNOWLEDGE INDEX</text>
  <text x="387" y="178" class="title">Stored as one Memory</text>
  <text x="387" y="204" font-size="13" fill="#1A1A2E">Your Hive keeps the correction</text>
  <text x="387" y="224" font-size="13" fill="#1A1A2E">and can recall it right away.</text>
  <line x1="387" y1="248" x2="613" y2="248" stroke="#EEEAF6"/>
  <text x="387" y="276" font-size="11.5" class="mono" fill="#7008E7">found by its words</text>
  <rect x="690" y="124" width="270" height="180" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <rect x="690" y="124" width="3.5" height="180" rx="1.75" fill="#009689"/>
  <text x="712" y="152" class="lbl" fill="#009689">ANY LATER SESSION</text>
  <text x="712" y="178" class="title">A teammate asks</text>
  <text x="712" y="204" font-size="13" fill="#1A1A2E">Add auth checks to the</text>
  <text x="712" y="224" font-size="13" fill="#1A1A2E">orders service.</text>
  <line x1="712" y1="248" x2="938" y2="248" stroke="#EEEAF6"/>
  <text x="712" y="276" font-size="11.5" class="mono" fill="#7008E7">agent validates in the gateway</text>
  <line x1="314" y1="214" x2="359" y2="214" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <text x="337" y="202" font-size="11" font-weight="700" text-anchor="middle" fill="#1A1A2E">store</text>
  <line x1="639" y1="214" x2="684" y2="214" stroke="#009689" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="662" y="202" font-size="11" font-weight="700" text-anchor="middle" fill="#1A1A2E">recall</text>
</svg>
