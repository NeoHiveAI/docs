  <rect x="385" y="274" width="230" height="44" rx="8" fill="#FFFFFF" stroke="#A78BFA"/>
  <text x="500" y="301" font-size="13" font-weight="600" text-anchor="middle" fill="#1A1A2E">Code and Documentation</text>
  <rect x="690" y="110" width="270" height="78" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="710" y="132" class="lbl" fill="#0D9488">GETS IT BACK</text>
  <text x="710" y="154" font-size="13.5" font-weight="700" fill="#1A1A2E">New engineer, day one</text>
  <text x="710" y="173" class="body">"How do we handle auth here?"</text>
  <rect x="690" y="200" width="270" height="78" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="710" y="222" class="lbl" fill="#0D9488">GETS IT BACK</text>
  <text x="710" y="244" font-size="13.5" font-weight="700" fill="#1A1A2E">Next person with the symptom</text>
  <text x="710" y="263" class="body">"Have we hit this before?"</text>
  <rect x="690" y="290" width="270" height="78" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="710" y="312" class="lbl" fill="#0D9488">GETS IT BACK</text>
  <text x="710" y="334" font-size="13.5" font-weight="700" fill="#1A1A2E">Every agent writing code</text>
  <text x="710" y="353" class="body">gets conventions that fit its task</text>
