  <rect x="40" y="130" width="270" height="84" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="60" y="154" class="lbl" fill="#7C3AED">TEACHES</text>
  <text x="60" y="178" font-size="13.5" font-weight="700" fill="#1A1A2E">Someone states a convention</text>
  <text x="60" y="198" class="body">"We use snake_case for columns."</text>
  <rect x="40" y="250" width="270" height="84" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
  <text x="60" y="274" class="lbl" fill="#7C3AED">TEACHES</text>
  <text x="60" y="298" font-size="13.5" font-weight="700" fill="#1A1A2E">Someone fixes a tricky bug</text>
  <text x="60" y="318" class="body">stores the symptom, cause and fix</text>
  <rect x="365" y="130" width="270" height="204" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
