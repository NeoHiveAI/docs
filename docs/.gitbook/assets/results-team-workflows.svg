  <text x="385" y="200" font-size="11" class="mono" fill="#6D28D9">/hives/&lt;hive-id&gt;/mcp</text>
  <rect x="385" y="220" width="230" height="44" rx="8" fill="#FFFFFF" stroke="#C084FC"/>
