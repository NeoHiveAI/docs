  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Team workflows</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">EVERY AGENT ON THE TEAM CONNECTS TO THE SAME HIVE</text>
