<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="500" viewBox="0 0 1000 500" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .small { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0D9488"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/></marker>
  </defs>
  <rect width="1000" height="500" fill="#FAF9FD"/>

  <!-- Header. Logo paths copied verbatim from refactor-docs-install-page.svg. -->
  <g transform="translate(40,26) scale(0.0793)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="88" y="52" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#1A1A2E">Where a repository token lives</text>
  <text x="88" y="74" font-size="12" font-weight="600" letter-spacing="1.1" fill="#6D28D9">FROM THE DATA SOURCES PAGE TO THE CLONE THAT SYNC USES</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#E4DFF1"/>
  <rect x="40" y="140" width="206" height="160" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="58" y="166" class="lbl" fill="#7C3AED">1. YOU ADD IT</text>
  <text x="58" y="192" class="title">Data Sources</text>
  <text x="58" y="222" class="body">Paste a token or</text>
  <text x="58" y="242" class="body">an SSH private key</text>
  <path d="M246 220 L274 220" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="278" y="140" width="206" height="160" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="296" y="166" class="lbl" fill="#0D9488">2. NEOHIVE CHECKS IT</text>
  <text x="296" y="192" class="title">GitHub or GitLab</text>
  <text x="296" y="222" class="body">A rejected token is</text>
  <text x="296" y="242" class="body">not saved</text>
  <path d="M484 220 L512 220" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="516" y="140" width="206" height="160" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="534" y="166" class="lbl" fill="#7C3AED">3. STORED ENCRYPTED</text>
  <text x="534" y="192" class="title">NeoHive database</text>
  <text x="534" y="222" class="body">AES-256-GCM, key in</text>
  <text x="534" y="242" class="body mono">.encryption_key</text>
  <path d="M722 220 L750 220" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="754" y="140" width="206" height="160" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="772" y="166" class="lbl" fill="#B45309">4. USED ON SYNC</text>
  <text x="772" y="192" class="title">The clone</text>
  <text x="772" y="222" class="body">HTTPS: token in git</text>
  <text x="772" y="242" class="body">config, not encrypted</text>
  <rect x="516" y="330" width="444" height="90" rx="10" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="536" y="356" class="lbl" fill="#7C3AED">ALL IN THE NEOHIVE-DATA VOLUME</text>
  <text x="536" y="380" class="body">Whoever can read the volume, or a backup of it,</text>
  <text x="536" y="400" class="body">can read the tokens. Protect backups the same way.</text>
  <path d="M620 300 L620 326" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M858 300 L858 326" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="330" width="446" height="90" rx="10" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="60" y="356" class="lbl" fill="#737373">NEVER SHOWN AGAIN</text>
  <text x="60" y="380" class="body">The dashboard and API never return the secret.</text>
  <text x="60" y="400" class="body">An SSH key is written to a temp file per git command.</text>
  <line x1="40" y1="460" x2="960" y2="460" stroke="#E4DFF1"/>
  <text x="40" y="482" class="small">To rotate: add a new connection, move each Index onto it, then delete the old one.</text>
</svg>
