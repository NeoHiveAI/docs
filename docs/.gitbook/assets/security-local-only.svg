<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1000" height="609" viewBox="0 0 1000 609" font-family="'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .body { font-size: 12.5px; fill: #4A4458; }
    .title { font-size: 15px; font-weight: 700; fill: #1A1A2E; }
    .small { font-size: 11.5px; fill: #737373; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#009689"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BB4D00"/></marker>
  </defs>
  <rect width="1000" height="609" fill="#FAF9FD"/>

  <!-- Content keeps the coordinates it had under the old top header. This group moves it up by 79 so its
       top edge sits at y=40. Draw new content inside the group with the same coordinates as the rest. -->
  <g transform="translate(0,-79)">
  <rect x="40" y="120" width="470" height="470" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="62" y="148" class="lbl" fill="#7C3AED">YOUR MACHINE</text>
  <rect x="62" y="166" width="426" height="250" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="82" y="194" class="title">NeoHive container</text>
  <text x="468" y="194" class="mono" fill="#7008E7" text-anchor="end" font-size="11">volume neohive-data</text>
  <circle cx="88" cy="226" r="4" fill="#008236"/>
  <text x="102" y="230" class="body">Your code and documents</text>
  <circle cx="88" cy="260" r="4" fill="#008236"/>
  <text x="102" y="264" class="body">Your Memories</text>
  <circle cx="88" cy="294" r="4" fill="#008236"/>
  <text x="102" y="298" class="body">Recall queries and results</text>
  <circle cx="88" cy="328" r="4" fill="#008236"/>
  <text x="102" y="332" class="body">Embeddings, made locally</text>
  <circle cx="88" cy="362" r="4" fill="#008236"/>
  <text x="102" y="366" class="body">Repository tokens, sent only to their provider</text>
  <text x="82" y="398" class="small">Usage metrics don't carry files, Memories, or recall queries.</text>
  <rect x="62" y="436" width="205" height="70" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="80" y="462" class="title">Your agent</text>
  <text x="80" y="482" fill="#4A4458" font-size="11.5">calls NeoHive on port 3577</text>
  <rect x="283" y="436" width="205" height="70" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="301" y="462" class="title">Your browser</text>
  <text x="301" y="482" fill="#4A4458" font-size="11.5">opens the dashboard</text>
  <text x="590" y="150" class="lbl" fill="#737373" text-anchor="middle">OUTBOUND</text>
  <rect x="660" y="170" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="197" fill="#1A1A2E" font-size="13" font-weight="700">License check</text>
  <text x="944" y="197" class="mono" fill="#737373" text-anchor="end" font-size="11">api.keygen.sh</text>
  <path d="M488 192 L656 192" fill="none" stroke="#BB4D00" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="660" y="224" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="251" fill="#1A1A2E" font-size="13" font-weight="700">Usage metrics</text>
  <text x="944" y="251" class="mono" fill="#737373" text-anchor="end" font-size="11">Grafana Cloud</text>
  <path d="M488 246 L656 246" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="278" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="305" fill="#1A1A2E" font-size="13" font-weight="700">Update check</text>
  <text x="944" y="305" class="mono" fill="#737373" text-anchor="end" font-size="11">hub.docker.com, GitHub</text>
  <path d="M488 300 L656 300" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="332" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="359" fill="#1A1A2E" font-size="13" font-weight="700">Model download</text>
  <text x="944" y="359" class="mono" fill="#737373" text-anchor="end" font-size="11">huggingface.co</text>
  <path d="M488 354 L656 354" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="386" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="413" fill="#1A1A2E" font-size="13" font-weight="700">Your data sources</text>
  <text x="944" y="413" class="mono" fill="#737373" text-anchor="end" font-size="11">GitHub, GitLab</text>
  <path d="M488 408 L656 408" fill="none" stroke="#009689" stroke-width="2" marker-end="url(#arrT)"/>
  <rect x="660" y="449" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <text x="676" y="476" fill="#1A1A2E" font-size="13" font-weight="700">Dashboard assets</text>
  <text x="944" y="476" class="mono" fill="#737373" text-anchor="end" font-size="11">fonts, Headway</text>
  <path d="M488 471 L656 471" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="660" y="530" width="300" height="44" rx="5" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="676" y="557" fill="#1A1A2E" font-size="13" font-weight="700">Your agent's model</text>
  <text x="944" y="557" fill="#737373" text-anchor="end" font-size="11">set by your agent</text>
  <path d="M164 506 L164 568 L600 568 L600 552 L656 552" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="588" y="184" font-size="9" font-weight="700" letter-spacing="0.8" fill="#BB4D00" text-anchor="middle">NEEDED EVERY 72 HOURS</text>
  <text x="40" y="616" class="small">Dashed: your agent or browser, not NeoHive, sends this.</text>
  </g>

  <!-- Footer. Logo paths copied verbatim from frontend/src/lib/icons/NeoHiveIcon.svelte. -->
  <line x1="40" y1="561" x2="960" y2="561" stroke="#E4DFF1"/>
  <g transform="translate(40,575) scale(0.04)" fill="none" stroke-width="20"><path d="M274.811 240.3L142.406 316.428L10.0002 240.3V87.665L142.406 11.5352L274.811 87.665V240.3Z" stroke="#7C3AED"/><path d="M406.428 315.818L274.023 391.946L141.617 315.818V163.183L274.023 87.0532L406.428 163.183V315.818Z" stroke="#A78BFA"/><path d="M274.811 391.336L142.406 467.464L10.0002 391.336V238.701L142.406 162.571L274.811 238.701V391.336Z" stroke="#C084FC"/></g>
  <text x="64" y="590" font-size="13" font-weight="700" fill="#1A1A2E">What stays on your machine<tspan dx="12" font-size="10" font-weight="600" letter-spacing="1" fill="#737373">YOUR CONTENT STAYS INSIDE THE BOX. A FEW CONNECTIONS LEAVE IT.</tspan></text>
</svg>
